<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Basic Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #f4f4f9;
      color: #333;
    }
    header {
      background-color: #007BFF;
      color: white;
      padding: 1rem 0;
    }
    main {
      padding: 2rem;
    }
    footer {
      background-color: #333;
      color: white;
      padding: 1rem 0;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    a {
      color: #007BFF;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
    <p>A simple website example</p>
  </header>
  <main>
    <h2>About This Site</h2>
    <p>This is a basic example of an HTML webpage.</p>
    <p>You can customize it further with CSS and JavaScript.</p>
    <p>Visit <a href="https://www.example.com" target="_blank">Example.com</a> for more info!</p>
  </main>
  <footer>
    <p>&copy; 2025 My Basic Website</p>
  </footer>
</body>
</html>
