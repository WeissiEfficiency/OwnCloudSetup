networks:
  backend:
    internal: true 

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"  # Expose Portainer UI on port 9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for managing containers
      - portainer_data:/data  # Persistent storage for Portainer data
    networks:
      - backend  # Attach to the 'backend' network


volumes:
  portainer_data:
    driver: local  # Store data persistently on the local disk